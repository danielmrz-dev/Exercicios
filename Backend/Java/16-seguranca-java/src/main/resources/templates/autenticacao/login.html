<!DOCTYPE html>
<html lang="pt-br"
      layout:decorate="~{template.html}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
</head>

<body>
<div layout:fragment="conteudo">
    <main class="container">
        <section class="card form-card">
            <h2 class="title">Login</h2>

            <form action="#" method="post" th:action="@{/login}">
                <div class="alert alert-danger text-center text-uppercase" th:if="${param.error != null}">
                    <p>
                        <i class="material-icons"></i><strong>Dados inválidos!</strong>
                    </p>
                </div>

                <div class="alert alert-danger text-center text-uppercase" th:if="${param.logout != null}">
                    <p>
                        <i class="material-icons"></i><strong>Você saiu da aplicação!</strong>
                    </p>
                </div>

                <div class="form-group">
                    <label class="required" for="username">Email:</label>
                    <input class="form-control" id="username" name="username" required="required" type="email">
                </div>

                <div class="form-group">
                    <label class="required" for="password">Senha:</label>
                    <input class="form-control" id="password" name="password" required="required" type="password">
                </div>

                <div class="form-group">
                    <label class="required" for="remember-me">Lembrar de mim:</label>
                    <input class="form-control" id="remember-me" name="remember-me" type="checkbox">
                </div>

                <button class="btn btn-primary" title="Entrar">
                    Entrar
                </button>
            </form>
        </section>
    </main>
</div>
</body>
</html>
